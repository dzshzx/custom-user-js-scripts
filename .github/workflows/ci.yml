name: CI

on:
  push:
    branches: ['candidate/**']
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  # Candidates finish so land can verify the exact SHA before publication.
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:prepare
      # A candidate or PR reaching master publishes its installable artifacts.
      # land recuts and rechecks when master advances.
      - name: Check the version plan against master
        run: node scripts/version-plan.mjs check --base-ref origin/master --target-ref HEAD
      - run: npm run verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-report
          path: .scratch/test-report/
          include-hidden-files: true

  # The required check is produced before master advances. Failure, cancellation
  # or a skipped verification cannot satisfy it.
  ci-ok:
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require verification to succeed
        env:
          RESULT: ${{ needs.verify.result }}
        run: |
          [ "$RESULT" = success ] || {
            echo "::error::verification concluded $RESULT"
            exit 1
          }
