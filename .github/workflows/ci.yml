name: CI

# The gate is scripts/check.sh. It runs once per commit: wt land runs it on the commit it is about
# to push to master, so a push starts no run here. The daily run and a manual run do the same gate
# on a clean GitHub-hosted machine; the daily run is also what checks a commit that reached master
# without wt land.
on:
  schedule:
    # 03:53 Asia/Shanghai.
    - cron: '53 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version plan in the gate reads origin/master.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:prepare
      - name: Gate
        run: bash scripts/check.sh
