name: CI

on:
  push:
    branches: [master, 'candidate/**']
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  # Only a PR run superseded by a newer commit on the same PR is cancelled;
  # candidate, master and dispatch runs always finish.
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # land tests each SHA on candidate/** and then fast-forwards master to it, so
  # the master push would rerun identical code. Only on default-branch pushes,
  # skip the work when this SHA already has a successful ci-ok from another run;
  # every other event skips this job and runs in full. Dependabot rebase merges
  # produce new SHAs with no prior ci-ok and still run in full. A failed query
  # yields tested=false: an extra run beats a missed one.
  dedupe:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          tested=false
          # details_url of an Actions check run is .../actions/runs/<run_id>/job/<job_id>;
          # this run's own ci-ok never counts.
          if ids=$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs?check_name=ci-ok&per_page=100" \
            --jq ".check_runs[] | select(.conclusion == \"success\") | select((.details_url // \"\") | test(\"/actions/runs/$RUN_ID/\") | not) | .id"); then
            if [ -n "$ids" ]; then tested=true; fi
          else
            echo "::warning::check-run query failed; running the full gate"
          fi
          echo "tested=$tested" | tee -a "$GITHUB_OUTPUT"

  verify:
    needs: dedupe
    if: ${{ !cancelled() && needs.dedupe.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version plan reads the published baseline from origin/master.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:prepare
      # Release gate (ADR-0002): a candidate or PR reaching master publishes, so
      # its versions must form a valid plan against the current master. `land`
      # re-tests a recut candidate whenever master advanced, so this baseline is
      # the one the fast-forward lands on. A master push is already published.
      - name: Check the version plan against master
        if: github.ref != 'refs/heads/master'
        run: node scripts/version-plan.mjs check --base-ref origin/master --target-ref HEAD
      # Build once, retain dist freshness and metadata gates, require all tests.
      - run: npm run verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-report
          path: .scratch/test-report/
          include-hidden-files: true

  # The master ruleset requires this one check on every pushed SHA. It runs even
  # when a needed job fails or is skipped. dedupe must succeed or be skipped;
  # when it found this SHA already verified, the check passes, otherwise every
  # other needed job must have succeeded, so adding or renaming jobs never
  # touches the ruleset.
  ci-ok:
    if: always()
    needs: [dedupe, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every needed job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          DEDUPE_RESULT: ${{ needs.dedupe.result }}
          TESTED: ${{ needs.dedupe.outputs.tested }}
        run: |
          printf '%s\n' "$NEEDS"
          case "$DEDUPE_RESULT" in
            success | skipped) ;;
            *) echo "::error::dedupe concluded $DEDUPE_RESULT"; exit 1 ;;
          esac
          if [ "$TESTED" = true ]; then
            echo "该 SHA 已由 candidate 运行验证"
            exit 0
          fi
          results=$(jq -r 'to_entries[] | select(.key != "dedupe") | "\(.key)=\(.value.result)"' <<<"$NEEDS")
          [ -n "$results" ] || exit 1
          for entry in $results; do
            [ "${entry#*=}" = success ] || { echo "::error::needed job ${entry%%=*} concluded ${entry#*=}"; exit 1; }
          done
