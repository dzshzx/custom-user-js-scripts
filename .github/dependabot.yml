# Dependency update policy: fleet-state ADR 0048.
# Weekly grouped patch/minor PRs are validated and merged by the owner; major updates stay separate.
version: 2
updates:
  - package-ecosystem: 'npm'
    open-pull-requests-limit: 0 # Updates are proposed by local Renovate; alerts stay enabled.
    directories:
      - '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 1
    groups:
      npm-minor-patch:
        update-types: ['minor', 'patch']
  - package-ecosystem: 'github-actions'
    open-pull-requests-limit: 0 # Updates are proposed by local Renovate; alerts stay enabled.
    directories:
      - '/'
      - '/.github/actions/*'
    ignore:
      # Own actions are pinned by the repos' pin-bump flow; Dependabot cannot read private repos.
      - dependency-name: 'dzshzx/*'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 1
    groups:
      github-actions-minor-patch:
        update-types: ['minor', 'patch']
