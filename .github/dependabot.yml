# Dependency upgrades run in the weekly agent batch; this file keeps Dependabot alerts only.
version: 2
updates:
  - package-ecosystem: 'npm'
    open-pull-requests-limit: 0 # Dependency upgrades run in the weekly agent batch; alerts stay enabled.
    directories:
      - '/'
    schedule:
      interval: 'weekly'
    groups:
      npm-minor-patch:
        update-types: ['minor', 'patch']
  - package-ecosystem: 'github-actions'
    open-pull-requests-limit: 0 # Dependency upgrades run in the weekly agent batch; alerts stay enabled.
    directories:
      - '/'
    ignore:
      # Own actions are pinned by the repos' pin-bump flow; Dependabot cannot read private repos.
      - dependency-name: 'dzshzx/*'
    schedule:
      interval: 'weekly'
    groups:
      github-actions-minor-patch:
        update-types: ['minor', 'patch']
