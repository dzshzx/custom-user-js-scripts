# 本仓的格式化与检查配置，由 scripts/format.sh 读入（各项含义见那里）。
# 字节必须保持不变的文件（git pathspec）；与 .prettierignore 保持一致。
EXCLUDE=(':(exclude)package-lock.json' ':(exclude)**/node_modules/**' ':(exclude)dist/**')
# prettier 固定在 package.json 的 devDependencies（npm ci 安装）。本仓没有 Python，Shell 只有门禁脚本，不查行数。
PRETTIER=node_modules
MAX_LINES=0
